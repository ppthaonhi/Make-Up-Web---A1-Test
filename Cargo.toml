[package]
name = "make-up-web"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17.2"

# Smaller, faster builds on school computers.
[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 2
debug = false
